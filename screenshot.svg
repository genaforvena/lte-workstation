<svg width="900" height="480" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Fira Code','Courier New',monospace">
  <!-- Background -->
  <rect width="900" height="480" rx="14" fill="#0d1117"/>

  <!-- ── Left: Phone outline ── -->
  <rect x="30" y="30" width="220" height="420" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <!-- notch -->
  <rect x="115" y="38" width="50" height="10" rx="5" fill="#0d1117"/>
  <!-- screen area -->
  <rect x="38" y="58" width="204" height="348" fill="#0d1117"/>
  <!-- home bar -->
  <rect x="105" y="420" width="70" height="5" rx="3" fill="#30363d"/>

  <!-- Terminal chrome inside phone -->
  <rect x="38" y="58" width="204" height="22" fill="#1c2128"/>
  <circle cx="54"  cy="69" r="5" fill="#ff5f57"/>
  <circle cx="69"  cy="69" r="5" fill="#ffbd2e"/>
  <circle cx="84"  cy="69" r="5" fill="#28c840"/>
  <text x="148" y="73" text-anchor="middle" fill="#8b949e" font-size="10">Termux</text>

  <!-- Terminal content -->
  <text x="46" y="102" fill="#4ec9b0" font-size="11">~ $</text>
  <text x="68" y="102" fill="#c9d1d9" font-size="11">mosh imozerov@</text>
  <text x="46" y="116" fill="#c9d1d9" font-size="11">  100.125.157.75</text>

  <text x="46" y="140" fill="#4ec9b0" font-size="11">workstation:~$</text>
  <text x="46" y="160" fill="#4ec9b0" font-size="11">workstation:~$</text>
  <text x="148" y="160" fill="#c9d1d9" font-size="11"> hx main.go</text>
  <text x="46" y="178" fill="#4ec9b0" font-size="11">workstation:~$</text>
  <text x="148" y="178" fill="#c9d1d9" font-size="11"> git log</text>

  <!-- Fake helix buffer lines -->
  <text x="46" y="202" fill="#6e7681" font-size="10">  1  package main</text>
  <text x="46" y="215" fill="#6e7681" font-size="10">  2  </text>
  <text x="46" y="228" fill="#6e7681" font-size="10">  3  import (</text>
  <text x="46" y="241" fill="#6e7681" font-size="10">  4    "fmt"</text>
  <text x="46" y="254" fill="#6e7681" font-size="10">  5  )</text>
  <rect x="46" y="261" width="8" height="12" fill="#4ec9b0" opacity="0.7"/>

  <!-- Status line -->
  <rect x="38" y="392" width="204" height="14" fill="#1c2128"/>
  <text x="46" y="403" fill="#58a6ff" font-size="9">NOR  main.go  ln 6</text>
  <text x="220" y="403" text-anchor="end" fill="#8b949e" font-size="9">LTE ▸ TS</text>

  <!-- ── Center: Arrow + label ── -->
  <text x="290" y="218" text-anchor="middle" fill="#8b949e" font-size="11">Tailscale</text>
  <text x="290" y="233" text-anchor="middle" fill="#8b949e" font-size="11">WireGuard</text>
  <line x1="256" y1="240" x2="320" y2="240" stroke="#388bfd" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="320,236 330,240 320,244" fill="#388bfd"/>

  <!-- ── Right panel: Telegram notification ── -->
  <rect x="340" y="30" width="530" height="420" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Top bar: Telegram header -->
  <rect x="340" y="30" width="530" height="48" rx="12" fill="#1c2128"/>
  <rect x="340" y="54" width="530" height="24" fill="#1c2128"/>
  <!-- Avatar circle -->
  <circle cx="370" cy="54" r="18" fill="#388bfd"/>
  <text x="370" y="60" text-anchor="middle" fill="white" font-size="14">🤖</text>
  <text x="396" y="50" fill="#c9d1d9" font-size="13" font-weight="bold">HomeBot</text>
  <text x="396" y="66" fill="#8b949e" font-size="11">online</text>

  <!-- Message bubble 1: boot notification -->
  <rect x="358" y="96" width="330" height="130" rx="12" fill="#1f6feb" opacity="0.25"/>
  <rect x="358" y="96" width="330" height="130" rx="12" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.5"/>
  <text x="372" y="118" fill="#c9d1d9" font-size="13">🏠 Machine online</text>
  <text x="372" y="143" fill="#8b949e" font-size="11">📡 SSH (changes on reboot):</text>
  <text x="372" y="160" fill="#79c0ff" font-size="11">ssh -p 19834 imozerov@</text>
  <text x="372" y="175" fill="#79c0ff" font-size="11">  3.tcp.eu.ngrok.io</text>
  <text x="372" y="198" fill="#8b949e" font-size="11">⚡ Mosh (permanent):</text>
  <text x="372" y="214" fill="#79c0ff" font-size="11">mosh imozerov@100.125.157.75</text>
  <text x="676" y="219" text-anchor="end" fill="#8b949e" font-size="10">09:14</text>

  <!-- Message bubble 2: proxy notification -->
  <rect x="358" y="242" width="330" height="90" rx="12" fill="#388bfd" opacity="0.15"/>
  <rect x="358" y="242" width="330" height="90" rx="12" fill="none" stroke="#388bfd" stroke-width="1" opacity="0.4"/>
  <text x="372" y="264" fill="#c9d1d9" font-size="13">🔐 MTProto proxy online</text>
  <text x="372" y="283" fill="#8b949e" font-size="11">Server: bore.pub:43721</text>
  <!-- Proxy button -->
  <rect x="372" y="294" width="204" height="28" rx="6" fill="#388bfd" opacity="0.9"/>
  <text x="474" y="313" text-anchor="middle" fill="white" font-size="12">Add Proxy to Telegram</text>
  <text x="676" y="325" text-anchor="end" fill="#8b949e" font-size="10">09:14</text>

  <!-- Bottom label -->
  <text x="605" y="390" text-anchor="middle" fill="#6e7681" font-size="11">Sent by bot on every reboot</text>
  <text x="605" y="408" text-anchor="middle" fill="#6e7681" font-size="11">bore.pub port updates automatically</text>

  <!-- Caption at bottom -->
  <text x="450" y="462" text-anchor="middle" fill="#6e7681" font-size="12">Old Android + $20 BT keyboard + Termux = pocket workstation · works anywhere on LTE</text>
</svg>
